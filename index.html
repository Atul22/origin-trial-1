<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Example</title>
</head>
<body>
    <button id="myButton">Set Cookie</button>
    <button id="myButton">Read Cookie</button>
    <script>
        var setButton = document.getElementById('myButton');
        var readButton = document.getElementById('myButton');

        setButton.onclick = function() {
            document.cookie = 'cookie1=test; Secure; Path=/; SameSite=None; Partitioned';
        };
        readButton.onclick = function() {
            console.log(document.cookie);
        };
    </script>
</body>
</html>
